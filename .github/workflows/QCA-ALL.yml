
# SPDX-License-Identifier: MIT
# QCA IPQ60XX 手动编译

name: QCA-ALL

# 仅允许手动启动
on:
  workflow_dispatch:
    inputs:
      PACKAGE:
        description: '手动调整插件包，多个请用换行符隔开'
        required: false
        type: string
      TEST:
        description: '仅输出配置文件，不编译固件'
        default: false
        required: false
        type: boolean

permissions:
  contents: write
  actions: write

jobs:
  config:
    name: IPQ60XX-WIFI-NO

    uses: ./.github/workflows/WRT-CORE.yml

    with:
      # 唯一编译配置
      WRT_CONFIG: IPQ60XX-WIFI-NO

      # 默认主题
      WRT_THEME: aurora

      # 默认主机名
      WRT_NAME: OWRT

      # Wi-Fi 设置
      WRT_SSID: OWRT
      WRT_WORD: '12345678'

      # 路由器管理地址
      WRT_IP: 192.168.31.1

      # 默认密码提示
      WRT_PW: '无'

      # 源码仓库
      WRT_REPO: https://github.com/VIKINGYFY/immortalwrt.git

      # 源码分支
      WRT_BRANCH: owrt

      # 源码名称
      WRT_SOURCE: VIKINGYFY/immortalwrt

      # 可选插件调整
      WRT_PACKAGE: ${{ inputs.PACKAGE }}

      # 测试模式
      WRT_TEST: ${{ inputs.TEST || false }}
